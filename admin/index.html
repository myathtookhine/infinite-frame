<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/if.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INFINITE FRAME - Admin Portal</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Infinite Frame Admin Portal - Manage your art gallery, showcase your work, and connect with art enthusiasts." />
    <meta name="keywords" content="art gallery management, artist portal, gallery admin, artwork management" />
    <meta name="author" content="Infinite Frame" />
    <meta name="robots" content="noindex, nofollow" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="INFINITE FRAME - Admin Portal" />
    <meta property="og:description" content="Manage your art gallery and showcase your work with Infinite Frame." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://admin.infiniteframe.online" />
    <meta property="og:image" content="https://admin.infiniteframe.online/og-image.jpg" />
    <meta property="og:site_name" content="Infinite Frame Admin" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="INFINITE FRAME - Admin Portal" />
    <meta name="twitter:description" content="Manage your art gallery and showcase your work with Infinite Frame." />
    <meta name="twitter:image" content="https://admin.infiniteframe.online/og-image.jpg" />
    
    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="canonical" href="https://admin.infiniteframe.online" />
  </head>
  <body>
    <!-- App Loading Screen - Brutalist Design -->
    <div id="app-loader">
      <div class="loader-content">
        <img src="/if.svg" alt="IF" class="loader-logo" />
        <div class="loader-bar">
          <div class="loader-bar-fill"></div>
        </div>
        <div class="loader-text">LOADING</div>
      </div>
    </div>
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #app-loader.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
      .loader-logo {
        width: 80px;
        height: 80px;
      }
      .loader-bar {
        width: 200px;
        height: 8px;
        background: #e0e0e0;
        border: 3px solid #000000;
        overflow: hidden;
      }
      .loader-bar-fill {
        height: 100%;
        width: 30%;
        background: #000000;
        animation: loading 1.2s ease-in-out infinite;
      }
      .loader-text {
        font-family: 'Inter', monospace, system-ui, sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        color: #000000;
      }
      @keyframes loading {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(250%); }
        100% { transform: translateX(-100%); }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
